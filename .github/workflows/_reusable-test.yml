# ABOUTME: Reusable workflow holding the test steps shared by the CI pipeline.
# ABOUTME: Called by ci.yml through `uses:`; never triggered by an event of its own.
#
# Why the _ prefix: convention that flags a support workflow, called by others
# via `uses:` and never triggered by its own event.
#
# Division of responsibility: the MATRIX lives in the caller (ci.yml), the TEST
# LOGIC lives here. Changing the tested versions does not touch these steps, and
# changing these steps does not touch the versions.
#
# Reference: docs/ci-pipeline.md

name: Reusable — Test

# workflow_call is what makes this file callable from another workflow.
on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version used to run the tests'
        type: string
        required: true

# security-events: write is required to upload the Trivy SARIF report to the
# Security tab. The caller grants it on the job that calls this workflow.
permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test (Python ${{ inputs.python-version }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      # Dependency cache. The key includes the Python version and the hash of
      # requirements*.txt:
      #   - same key as a previous run -> cache hit, nothing is downloaded
      #   - different key              -> miss, but restore-keys pulls a nearby
      #                                   cache and reuses part of the install
      # The point is not saving machine minutes, it is fast feedback on the PR.
      - name: Cache pip downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ inputs.python-version }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ inputs.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Trivy sees more than pip-audit: on top of the Python libraries it also
      # covers the operating system packages of the base image.
      #
      # exit-code: '1' is what turns the scan into a GATE. Without it Trivy only
      # reports and the pipeline stays green with a known vulnerability.
      # ignore-unfixed: true drops CVEs with no patch available, which would
      # otherwise keep the build red forever with nothing to do about it.
      # format: sarif feeds the Security > Code scanning tab.
      #
      # severity starts at MEDIUM because a HIGH,CRITICAL threshold would let
      # through the exact class of vulnerability this project cares about: the
      # requests CVEs that pip-audit rejects are all rated MEDIUM by Trivy. Two
      # gates disagreeing on the same dependency is worse than one strict gate.
      # ignore-unfixed keeps the extra strictness actionable: only findings with
      # a published fix can ever break the build.
      - name: Scan dependencies and manifests (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      # if: always() is required here. The step above exits 1 when it finds a
      # vulnerability, and without always() the report would never reach the
      # Security tab exactly when there is something to report.
      #
      # category separates the three matrix runs. Uploading several SARIF files
      # for the same commit without a category makes them overwrite each other,
      # and concurrent uploads can collide.
      - name: Upload Trivy report to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-python-${{ inputs.python-version }}

      - name: Run tests (pytest)
        run: pytest -v

      # Security gate (shift-left): pip-audit queries the PyPI/OSV advisory
      # database and fails the job when a dependency has a known CVE with a fix
      # available. The -r flag keeps the gate focused on PRODUCTION
      # dependencies: without it, a CVE in pytest or ruff would break the
      # application pipeline.
      - name: Audit dependencies (pip-audit)
        run: pip-audit -r requirements.txt
