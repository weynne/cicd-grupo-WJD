# ABOUTME: Workflow reutilizável com os steps de teste compartilhados pelo CI.
# ABOUTME: Chamado pelo ci.yml via `uses:`; nunca disparado por evento próprio.
#
# Por que o prefixo _: convenção que sinaliza workflow de apoio, chamado por
# outro via `uses:` e nunca disparado por evento próprio.
#
# Divisão de responsabilidade: a MATRIX vive no chamador (ci.yml), a LÓGICA DE
# TESTE vive aqui. Mudar as versões testadas não encosta nestes steps, e mudar
# estes steps não encosta nas versões.
#
# Referência: docs/ci-pipeline.md

name: Reusable — Test

# É o workflow_call que torna este arquivo chamável por outro workflow.
on:
  workflow_call:
    inputs:
      python-version:
        description: 'Versão do Python usada para rodar os testes'
        type: string
        required: true

# security-events: write é necessário para enviar o relatório SARIF do Trivy
# para a aba Security. Quem concede é o chamador, no job que chama este
# workflow.
permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test (Python ${{ inputs.python-version }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      # Cache de dependências. A chave inclui a versão do Python e o hash dos
      # requirements*.txt:
      #   - chave igual à de uma execução anterior -> acerto, nada é baixado
      #   - chave diferente -> erro de cache, mas o restore-keys puxa um cache
      #                        próximo e aproveita parte da instalação
      # O objetivo não é economizar minuto de máquina: é retorno rápido no PR.
      - name: Cache pip downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ inputs.python-version }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ inputs.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # O Trivy enxerga mais que o pip-audit: além das bibliotecas Python, ele
      # cobre os pacotes do sistema operacional da imagem base.
      #
      # exit-code: '1' é o que transforma o scan em PORTÃO. Sem isso o Trivy só
      # relata, e o pipeline segue verde com uma vulnerabilidade conhecida.
      # ignore-unfixed: true descarta CVE sem correção publicada, que de outro
      # modo deixaria a build vermelha para sempre sem nada a fazer.
      # format: sarif alimenta a aba Security > Code scanning.
      #
      # A severidade começa em MEDIUM porque um corte em HIGH,CRITICAL deixaria
      # passar exatamente a classe de vulnerabilidade que importa aqui: os CVEs
      # do requests que o pip-audit reprova são todos MEDIUM para o Trivy. Dois
      # portões discordando sobre a mesma dependência é pior que um portão
      # rigoroso. O ignore-unfixed mantém esse rigor acionável: só achado com
      # correção publicada consegue quebrar a build.
      - name: Scan dependencies and manifests (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      # O if: always() é obrigatório aqui. O step acima sai com 1 quando acha
      # vulnerabilidade, e sem o always() o relatório nunca chegaria à aba
      # Security exatamente quando há algo para relatar.
      #
      # O category separa as três execuções da matrix. Enviar vários SARIF do
      # mesmo commit sem category faz um sobrescrever o outro, e envios
      # simultâneos podem colidir.
      - name: Upload Trivy report to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-python-${{ inputs.python-version }}

      - name: Run tests (pytest)
        run: pytest -v

      # Portão de segurança (shift-left): o pip-audit consulta a base de
      # advisories do PyPI/OSV e reprova o job quando uma dependência tem CVE
      # conhecido com correção disponível. O -r mantém o portão focado nas
      # dependências de PRODUÇÃO: sem ele, um CVE no pytest ou no ruff derrubaria
      # o pipeline da aplicação.
      - name: Audit dependencies (pip-audit)
        run: pip-audit -r requirements.txt
