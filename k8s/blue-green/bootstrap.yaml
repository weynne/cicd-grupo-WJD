# ABOUTME: Bootstrap Blue/Green da todolist: dois Deployments coloridos, um Service
# ABOUTME: ClusterIP para cada um, um Service de produção (cujo selector o pipeline de
# ABOUTME: switch troca) e Ingresses roteando produção e um host por cor via nginx.
---
apiVersion: v1
kind: Namespace
metadata:
  name: todolist-bg
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-blue
  namespace: todolist-bg
  labels:
    app: todolist
    color: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todolist
      color: blue
  template:
    metadata:
      labels:
        app: todolist
        color: blue
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: todolist
          # Troque SEU_USUARIO_DOCKERHUB pelo seu usuário do Docker Hub antes do
          # primeiro deploy: o bootstrap sobe as duas cores com esta imagem.
          image: SEU_USUARIO_DOCKERHUB/app-k8s-todolist:latest
          ports:
            - containerPort: 5000
          env:
            - name: APP_PORT
              value: "5000"
            - name: APP_COLOR
              value: blue
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-green
  namespace: todolist-bg
  labels:
    app: todolist
    color: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todolist
      color: green
  template:
    metadata:
      labels:
        app: todolist
        color: green
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: todolist
          # Troque SEU_USUARIO_DOCKERHUB pelo seu usuário do Docker Hub antes do
          # primeiro deploy: o bootstrap sobe as duas cores com esta imagem.
          image: SEU_USUARIO_DOCKERHUB/app-k8s-todolist:latest
          ports:
            - containerPort: 5000
          env:
            - name: APP_PORT
              value: "5000"
            - name: APP_COLOR
              value: green
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
# Service fixo da cor (acesso direto para testar o slot blue).
apiVersion: v1
kind: Service
metadata:
  name: todolist-blue
  namespace: todolist-bg
  labels:
    app: todolist
    color: blue
spec:
  type: ClusterIP
  selector:
    app: todolist
    color: blue
  ports:
    - port: 80
      targetPort: 5000
---
# Service fixo da cor (acesso direto para testar o slot green).
apiVersion: v1
kind: Service
metadata:
  name: todolist-green
  namespace: todolist-bg
  labels:
    app: todolist
    color: green
spec:
  type: ClusterIP
  selector:
    app: todolist
    color: green
  ports:
    - port: 80
      targetPort: 5000
---
# Service de produção: o pipeline de switch troca a cor do selector dele.
apiVersion: v1
kind: Service
metadata:
  name: todolist
  namespace: todolist-bg
  labels:
    app: todolist
spec:
  type: ClusterIP
  selector:
    app: todolist
    color: blue
  ports:
    - port: 80
      targetPort: 5000
---
# Um Ingress, três hosts: produção (trocada pelo selector do Service) e um host
# estável por cor, para testar diretamente antes do switch.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todolist-bg
  namespace: todolist-bg
spec:
  ingressClassName: nginx
  rules:
    - host: todolist-bg.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todolist
                port:
                  number: 80
    - host: blue.todolist-bg.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todolist-blue
                port:
                  number: 80
    - host: green.todolist-bg.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todolist-green
                port:
                  number: 80
